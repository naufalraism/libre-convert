<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konversi Word ke PDF langsung di browser, tanpa upload</title>
    <meta
      name="description"
      content="Ubah file Word, Excel, PowerPoint, OpenDocument, dan gambar menjadi PDF langsung di browser dengan LibreOffice WASM. File tidak diunggah ke server dan bisa dipakai offline."
    />
    <meta name="theme-color" content="#f6f2ea" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Konversi Word ke PDF, tanpa upload" />
    <meta
      property="og:description"
      content="Word, Excel, PowerPoint, dan gambar ke PDF langsung di browser. File tidak pernah keluar dari perangkatmu."
    />
    <!-- Tambahkan canonical, og:url, dan og:image setelah domainmu final. -->
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Terapkan tema sebelum halaman tampil, supaya tidak berkedip terang lalu gelap.
      ;(function () {
        try {
          var theme = localStorage.getItem('libre-convert:theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <!-- LibreOffice's Qt layer needs a canvas with this id before it starts. It is never shown. -->
    <canvas id="qtcanvas" class="qt-canvas" width="64" height="64" aria-hidden="true"></canvas>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
